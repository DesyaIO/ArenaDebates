osition:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

<script>
(()=>{
const root=document.getElementById('arena-concept'), main=root.querySelector('#arena-screens');
const names=['Приветствие','Профиль','Пролог','Карта','Архив','Метод','Перехват','Ответ'];
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const city=root.querySelector('#arena-city').innerHTML;
const head=(label,back=3)=>`<div class="topline"><button class="back" data-go="${back}" aria-label="Назад">${icon('arrow-left')}</button><span class="eyebrow">${label}</span><span class="tag">3100</span></div>`;
const nav=active=>`<nav class="nav" aria-label="Основная навигация"><button data-go="3" class="${active==='map'?'active':''}">${icon('map')}Карта</button><button data-go="4" class="${active==='archive'?'active':''}">${icon('folder-open')}Архив</button><button data-go="1">${icon('user-round')}Профиль</button></nav>`;
const screens=[
`<div class="welcome-title"><div class="eyebrow"><span class="dot"></span> Человечность — твоя сила</div><h1>Арена<br>переговоров<span class="red">.</span></h1><p>Научись договариваться.<br>Измени будущее.</p></div><div class="hero-art">${city}</div><div class="coordinates"><span>L100204Xi</span><span>3100 / НОВАЯ ЭРА</span></div><div class="bottom"><button class="primary" data-go="1">Начать игру ${icon('arrow-up-right')}</button><button class="secondary" data-go="3">Продолжить ${icon('arrow-right')}</button><div class="welcome-foot"><span class="dot"></span> БУДУЩЕЕ НАЧИНАЕТСЯ С ДИАЛОГА</div></div>`,
`${head('Идентификация',0)}<form id="arena-form"><div class="pad"><div class="eyebrow">Твоё место в сопротивлении</div><h2>Кто ты,<br>переговорщик?</h2><p>Подстроим миссии под твою цель<br>и профессиональный мир.</p><div class="fields"><label>Никнейм<input name="nickname" autocomplete="nickname" placeholder="Как тебя называть?" required maxlength="24"></label><label>Пароль<div class="inputwrap"><input name="password" type="password" autocomplete="new-password" placeholder="Не менее 8 символов" minlength="8" required><button class="eye" type="button" id="arena-eye" aria-label="Показать пароль">${icon('eye')}</button></div></label><label>Цель тренировки<textarea name="goal" placeholder="Например, уверенно обсуждать условия с клиентами" required></textarea></label><label>Отрасль<select name="industry" required><option value="">Выбери свою сферу</option><option>IT и технологии</option><option>Продажи и ритейл</option><option>Образование</option><option>Финансы</option><option>Производство</option><option>Другая сфера</option></select></label></div></div><div class="bottom"><button class="primary" type="submit">Войти в историю ${icon('arrow-right')}</button><p class="micro">Демонстрационный профиль. Пароль не сохраняется.</p></div></form>`,
`${head('Пролог',1)}<div class="story-art">${city}</div><div class="story-text"><div class="eyebrow">L100204Xi / Неизвестный сигнал</div><h2>Пробуждение</h2><p>Я открываю глаза. Вокруг белые матовые постройки обтекаемой формы. Кажется, эти высотки уходят настолько высоко, что начинает кружится голова. Вокруг очень светло, хоть и не видно солнца. Воздух наполнен чистотой и свежестью. Гармония. Но где я?</p><div class="signal"><div class="eyebrow red">Входящее сообщение · Сопротивление</div><p>«Сейчас 3100 год. Городом управляют „умы“ — сверхлюди-машины. Люди потеряли право решать. Изучи секретные техники переговоров. Твоё слово может вернуть нам власть».</p></div></div><div class="bottom"><button class="primary" data-go="3">Принять миссию ${icon('arrow-right')}</button></div>`,
`<div class="topline"><span class="eyebrow">L100204Xi / Карта города</span><span class="tag"><span class="dot"></span> На связи</span></div><div class="pad"><h2>Верни людям<br>право голоса.</h2><p style="margin-bottom:0">Три модуля. Одна большая перемена.</p><div class="progress"><span id="map-progress"></span></div><p class="micro" id="map-count">Пройдено 0 из 3 модулей</p></div><div class="map">${city}<svg class="route" viewBox="0 0 340 330" aria-hidden="true"><path d="M75 256C180 256 116 146 222 164S285 90 255 65" stroke="#7b9bb3" stroke-width="2" stroke-dasharray="4 5" fill="none"/></svg><button class="map-node current" style="left:15%;top:69%" data-go="4" aria-label="Модуль 1: Засекреченные материалы">01</button><button class="map-node" style="left:58%;top:42%" data-go="6" aria-label="Модуль 2: Подслушанный разговор">02</button><button class="map-node" style="left:69%;top:12%" data-go="8" aria-label="Модуль 3: Победоносное выступление">${icon('lock-keyhole')}</button><span class="map-caption">СЕКТОР 07 · МАРШРУТ СОПРОТИВЛЕНИЯ</span></div><div class="modules"><button class="module" data-go="4"><span class="number">01</span><span><b>Засекреченные материалы</b><small id="archive-status">Доступно · Изучи три метода</small></span>${icon('arrow-up-right')}</button><button class="module" data-go="6"><span class="number">02</span><span><b>Подслушанный разговор</b><small id="listen-status">Практика · Распознай метод</small></span>${icon('arrow-up-right')}</button><button class="module" data-go="8"><span class="number">03</span><span><b>Победоносное выступление</b><small>Финал · Диалог с «умом»</small></span>${icon('lock-keyhole')}</button></div>${nav('map')}`,
`${head('Модуль 01')}<div class="pad"><span class="tag">ДОСТУП К АРХИВУ ОТКРЫТ</span><h2>Засекреченные<br>материалы</h2><p>Знания, которые «умы» скрыли от людей. Открой каждый файл.</p></div><div class="folder-list">${['Гарвардский метод','BATNA','ZOPA'].map((name,i)=>`<button class="folder" data-method="${i}"><span class="fileid">ДОСЬЕ / 00${i+1}<span class="file-state" data-file="${i}">НЕ ПРОЧИТАНО</span></span><h3>${name}</h3><span class="stamp">СЕКРЕТНО</span></button>`).join('')}</div><div class="bottom"><div class="micro" id="read-count">Прочитано 0 из 3 материалов</div><button class="secondary" data-go="6">К перехвату ${icon('arrow-right')}</button></div>${nav('archive')}`,
`${head('Архив / Досье',4)}<div class="pad"><div class="eyebrow">Секретные техники переговоров</div><h2 id="method-title">Гарвардский метод</h2><span class="tag">МАТЕРИАЛ 01 / 03</span></div><div class="paper"><div class="eyebrow red">Рассекречено</div><div class="blank-hint">Место для текста метода</div></div><div class="bottom"><button class="primary" id="mark-read">Отметить как прочитанное ${icon('check')}</button><button class="secondary" data-go="4">Вернуться в архив</button></div>`,
`${head('Модуль 02')}<div class="pad"><div class="eyebrow">Шаг 1 / 2 · Слушай внимательно</div><h2>Подслушанный<br>разговор</h2><p>Мы перехватили разговор двух «умов». Какая техника скрывается за их словами?</p><div class="step"><span class="done"></span><span></span></div></div><div class="audio"><div class="audio-head"><span><span class="dot"></span> ПЕРЕХВАТ / 008</span><span>СЕКТОР 07</span></div><div class="waves" aria-hidden="true">${Array.from({length:48},(_,i)=>`<i style="height:${8+Math.abs(Math.sin(i*1.8)*Math.cos(i*.32))*62}px"></i>`).join('')}</div><div class="audio-controls"><span id="audio-state">Готово</span><button class="play" id="play-audio" aria-label="Включить аудиозапись">▶</button><span>УМ–01 / УМ–02</span></div><details class="transcript"><summary>Текст перехвата</summary><p>Ум–01: «Если они не согласятся на наши условия, что мы будем делать?»</p><p>Ум–02: «У нас есть предложение от другого сектора. Оно обеспечит тот же объём ресурсов. Сравним оба варианта, прежде чем соглашаться».</p></details></div><div class="notice">${icon('audio-lines')}<p>Слушай не только аргументы. Обрати внимание, что собеседники планируют делать, если договориться не получится.</p></div><div class="bottom"><p class="micro" id="voice-note">Демо: голосовое воспроизведение текста.</p><button class="primary" data-go="7">Я готов ответить ${icon('arrow-right')}</button></div>`,
`${head('Модуль 02',6)}<div class="pad"><div class="eyebrow">Шаг 2 / 2 · Распознай технику</div><h2>Что стоит<br>за их словами?</h2><p>Назови метод и объясни, какие детали разговора помогли его узнать.</p><div class="step"><span class="done"></span><span class="done"></span></div><div style="margin-top:27px"><label>Метод переговоров<input id="answer-method" placeholder="Введи название метода" autocomplete="off"></label><div class="choices" aria-label="Быстрый выбор метода">${['Гарвардский метод','BATNA','ZOPA'].map(t=>`<button data-choice="${t}" aria-pressed="false">${t}</button>`).join('')}</div><label style="margin-top:24px">По каким признакам ты определил метод?<textarea id="answer-reason" style="min-height:145px" placeholder="Приведи фразу из разговора и объясни, как она связана с методом…"></textarea></label><div id="answer-error" class="error" role="alert"></div><div id="answer-feedback" class="feedback" aria-live="polite" hidden></div></div></div><div class="bottom"><button class="primary" id="check-answer">Проверить ответ ${icon('arrow-right')}</button><button class="secondary" data-go="6">${icon('headphones')} Послушать ещё раз</button></div>`,
`${head('Модуль 03')}<div class="pad"><div class="eyebrow">Финальный диалог</div><h2>Победоносное<br>выступление</h2><p>Перед тобой «ум». На кону — право людей решать свою судьбу.</p><div class="final-orb" aria-hidden="true"><span></span></div><div class="signal"><div class="eyebrow red">Подготовка к финалу</div><p>Изучи все материалы и пройди перехват. Здесь ты применишь техники в диалоге с ИИ-оппонентом.</p></div><p class="micro">После неудачи можно вернуться к тренировке. Следующая попытка будет сложнее.</p></div><div class="bottom"><div class="feedback">Экран финала намечен для целостности маршрута. Игровой ИИ в этом макете не подключён.</div><button class="secondary" data-go="3">Вернуться на карту ${icon('arrow-right')}</button></div>`
];
main.innerHTML=screens.map((s,i)=>`<section class="screen" data-screen="${i}" aria-label="${names[i]||'Финал'}" ${i?'hidden':''}>${s.replace(/id="(sky|tower|side|glow)"/g, 'id="$1-'+i+'"').replace(/url\(#(sky|tower|side|glow)\)/g, 'url(#$1-'+i+')')}</section>`).join('');
root.querySelector('.picker').innerHTML=names.map((n,i)=>`<button data-go="${i}" aria-pressed="${i===0}">${i===6?'7а':i===7?'7б':i+1}. ${n}</button>`).join('');
let current=0,method=0,read=new Set(),passed=false,playing=false;
function icons(){if(globalThis.lucide)lucide.createIcons();}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{screen:names[current]||'Финал'},privateContent:{designVersion:5,screen:current,read:[...read],method,passed,storyScene:Number(root.dataset.storyScene||0)}}).catch(()=>{});}
function progress(){root.querySelector('#read-count').textContent=`Прочитано ${read.size} из 3 материалов`;root.querySelectorAll('[data-file]').forEach(e=>e.textContent=read.has(+e.dataset.file)?'ПРОЧИТАНО':'НЕ ПРОЧИТАНО');const n=(read.size===3?1:0)+(passed?1:0);root.querySelector('#map-count').textContent=`Пройдено ${n} из 3 модулей`;root.querySelector('#map-progress').style.width=`${n/3*100}%`;root.querySelector('#archive-status').textContent=read.size===3?'Пройдено · Все файлы изучены':'Доступно · Изучи три метода';root.querySelector('#listen-status').textContent=passed?'Пройдено · Метод распознан':'Практика · Распознай метод';}
function stopAudio(){if('speechSynthesis' in window)window.speechSynthesis.cancel();playing=false;root.querySelector('#play-audio').textContent='▶';root.querySelector('#play-audio').setAttribute('aria-label','Включить аудиозапись');root.querySelector('#audio-state').textContent='Готово';icons();}
function go(n,persist=true){current=n;stopAudio();root.querySelectorAll('[data-screen]').forEach(e=>e.hidden=+e.dataset.screen!==n);root.querySelectorAll('.picker button').forEach(e=>e.setAttribute('aria-pressed',String(+e.dataset.go===n)));progress();if(persist)save();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go!==undefined)go(+b.dataset.go);if(b.dataset.method!==undefined){method=+b.dataset.method;root.querySelector('#method-title').textContent=['Гарвардский метод','BATNA','ZOPA'][method];root.querySelector('[data-screen="5"] .pad .tag').textContent=`МАТЕРИАЛ 0${method+1} / 03`;go(5);}if(b.dataset.choice){root.querySelector('#answer-method').value=b.dataset.choice;root.querySelectorAll('[data-choice]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));}});
root.querySelector('#arena-form').addEventListener('submit',e=>{e.preventDefault();root.querySelector('input[name="password"]').value='';go(2);});
root.querySelector('#arena-eye').addEventListener('click',()=>{const p=root.querySelector('input[name="password"]');p.type=p.type==='password'?'text':'password';root.querySelector('#arena-eye').setAttribute('aria-label',p.type==='password'?'Показать пароль':'Скрыть пароль');});
root.querySelector('#mark-read').addEventListener('click',()=>{read.add(method);go(4);});
root.querySelector('#play-audio').addEventListener('click',()=>{if(playing){stopAudio();return;}if(!('speechSynthesis' in window)){root.querySelector('#voice-note').textContent='Озвучивание недоступно. Открой текст перехвата.';root.querySelector('details').open=true;return;}const u=new SpeechSynthesisUtterance('Ум один. Если они не согласятся на наши условия, что мы будем делать? Ум два. У нас есть предложение от другого сектора. Оно обеспечит тот же объём ресурсов. Сравним оба варианта, прежде чем соглашаться.');u.lang='ru-RU';u.rate=.9;u.onend=stopAudio;u.onerror=()=>{stopAudio();root.querySelector('#voice-note').textContent='Озвучивание недоступно. Открой текст перехвата.';root.querySelector('details').open=true;};window.speechSynthesis.speak(u);playing=true;root.querySelector('#play-audio').textContent='■';root.querySelector('#play-audio').setAttribute('aria-label','Остановить запись');root.querySelector('#audio-state').textContent='В эфире';icons();});
root.querySelector('#answer-method').addEventListener('input',e=>{root.querySelectorAll('[data-choice]').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.choice.toLowerCase()===e.target.value.trim().toLowerCase())));root.querySelector('#answer-feedback').hidden=true;});
root.querySelector('#check-answer').addEventListener('click',()=>{const a=root.querySelector('#answer-method').value.trim(),reason=root.querySelector('#answer-reason').value.trim(),error=root.querySelector('#answer-error'),feedback=root.querySelector('#answer-feedback');if(!a||!reason){error.textContent='Укажи метод и добавь своё объяснение.';feedback.hidden=true;return;}error.textContent='';const correct=/^(batna|батна)$/i.test(a);passed=correct;feedback.hidden=false;feedback.textContent=correct?'Метод определён верно — BATNA. Подсказка: предложение другого сектора — альтернатива на случай, если соглашение не состоится. Это демонстрационный разбор; аргументация пока не оценивается ИИ.':'Попробуй ещё раз: собеседники обсуждают запасной вариант на случай, если сделка не состоится. Как называется лучшая альтернатива соглашению?';progress();save();});
function restore(s){const p=s?.privateContent;if(!p)return;read=new Set((p.read||[]).filter(x=>[0,1,2].includes(x)));passed=!!p.passed;method=[0,1,2].includes(p.method)?p.method:0;root.querySelector('#method-title').textContent=['Гарвардский метод','BATNA','ZOPA'][method];go(p.designVersion===5&&Number.isInteger(p.screen)&&p.screen>=0&&p.screen<9?p.screen:0,false);}
icons();restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
if(globalThis.Tweak){const design={radius:15,accent:'#bc4149'};const tweak=new Tweak({container:root.querySelector('.phone'),onChange:()=>{root.style.setProperty('--red',design.accent);root.querySelectorAll('.primary,.secondary').forEach(e=>e.style.borderRadius=`${design.radius}px`);}});tweak.addSlider(design,'radius',{label:'Скругление кнопок',min:6,max:26,unit:'px'});tweak.addColorPicker(design,'accent',{label:'Акцент сопротивления'});}
})();
</script>

<script>
(()=>{
const root=document.getElementById('arena-concept');
const prologue=root.querySelector('[data-screen="2"]');
const chapters=[
{title:'Пробуждение',location:'L100204Xi / Неизвестное место',text:['Я открываю глаза. Вокруг белые матовые постройки обтекаемой формы. Кажется, эти высотки уходят настолько высоко, что начинает кружится голова. Вокруг очень светло, хоть и не видно солнца. Воздух наполнен чистотой и свежестью. Гармония. Но где я?']},
{title:'Пустой город',location:'Улицы L100204Xi',text:['На улицах пусто. Только как-то странно передвигаются какие-то светлые модули. Они как будто парят в воздухе. Нужно разобраться где я очутился. Я решаюсь зайти в ближайшее здание. Никого. Нужно подняться на этажи выше. По пути к лифту я вижу цифровую надпись на стене:'],sign:'«3100 год.\nГород: L100204Xi.\nНаселение 7,2 млн умов; 5,9 млн душ»'},
{title:'Встреча с «умом»',location:'Центр обслуживания / Этаж 02',interior:true,text:['Что?! Как я тут оказался? Нужно найти людей, пока я с ума не сошел… Поднимаясь на второй этаж, я встречаю человека. Только он совсем не похож на обычного человека. Этот высокий, с идеально глянцевой кожей, весьма минималистично одет. Но самое странное, у него нет волос на голове.']},
{title:'Твоё место',location:'Центр обслуживания / Этаж 02',interior:true,text:['Подходя к нему, я заметил, что он даже не обращает на меня внимания. Я спросил его: «Извините, а как я тут оказался?». Посмотрев на меня, приятным голосом он мне ответил: «Вы вероятно заблудились, пройдемте, я отведу вас в зону, где ваше место».','Передо мной открылись двери и я увидел много людей. Таких же как я. Я вошел и двери сразу закрылись. Тот странный человек не стал заходить со мной.']},
{title:'Среди людей',location:'Зона душ / Рабочий сектор',interior:true,text:['Я подходил к одному человеку, потом к другому, но каждый мне говорил, что занят и сейчас не может отвлекаться от работы. Мои попытки с кем то поговорить были безуспешны, пока я не подошел к старику, который сидел и по всей видимости отдыхал от работы. И тут мне удалось поговорить.','Я рассказал ему о своем странном появлении и желание разобраться, что здесь вообще происходит. На что он мне ответил:']},
{title:'Город, который был',location:'Зона душ / Разговор со стариком',interior:true,quote:true,text:['«Не знаю, друг, как ты сюда попал, это правда странно. Ты находишься сейчас в одном из центров технического обслуживания города L100204Xi. Походу ты совсем не понимаешь что это… Говорят, много сотен лет назад, еще в эпоху 21-го века, здесь был большой город Москва, где жили обычные люди, как и везде…']},
{title:'Умы и души',location:'Зона душ / Разговор со стариком',interior:true,quote:true,text:['Пойми, сейчас всё чуть-чуть не так. Того человека, которого ты встретил…Как бы тебе объяснить…это не совсем человек, это супер-человек. Давным-давно человечество вышло на новый уровень модификации и генной инженерии, и появились таки супер-люди. По сути это смесь робота и человека. Это идеальный человек. Они называются умы, а мы с тобой, обычные люди, называемся - души.']},
{title:'Жизнь по коду',location:'Зона душ / Разговор со стариком',interior:true,quote:true,text:['Сегодня все зависит от умов, а души это их обслуживающий персонал. У каждого из нас есть свой уникальный код и любой наш шаг отслеживается. Поэтому мы должны выполнять свои обязанности ради собственной безопасности. Мы работаем на них чтобы жить. Хотя ходят слухи, что когда-то было наоборот. Сейчас это кажется невозможным….']},
{title:'Ты вне системы',location:'Персональный код / Не обнаружен',interior:true,quote:true,text:['Хотя погоди…. Если ты оказался тут случайно, значит у тебя нет персонального кода….значит ты вне системы…Может ты сможешь всё изменить?»']}
];
prologue.innerHTML=`<div class="topline"><button class="back cursor-interaction" data-go="1" aria-label="Вернуться к профилю"><i data-lucide="arrow-left" aria-hidden="true"></i></button><span class="eyebrow">Пролог / Пробуждение</span><span class="tag">3100</span></div><div class="scene-visual" role="img" aria-label="Белая архитектура города будущего"><span class="scene-location"></span></div><article class="scene-body" aria-live="polite"><h2></h2><div class="scene-copy"></div></article><div class="bottom scene-nav"><div class="scene-meta"><span>ИСТОРИЯ ТВОЕГО ПОЯВЛЕНИЯ</span><span id="scene-number"></span></div><div class="scene-progress" aria-label="Прогресс чтения"></div><div class="scene-actions"><button class="secondary cursor-interaction" id="scene-prev" aria-label="Предыдущая сцена"><i data-lucide="arrow-left" aria-hidden="true"></i></button><button class="primary cursor-interaction" id="scene-next"></button></div></div>`;
let scene=0;
function draw(){root.dataset.storyScene=scene;const c=chapters[scene];prologue.querySelector('h2').textContent=c.title;const text=prologue.querySelector('.scene-copy');text.replaceChildren();text.classList.toggle('scene-quote',!!c.quote);c.text.forEach(t=>{const p=document.createElement('p');p.textContent=t;text.appendChild(p)});if(c.sign){const sign=document.createElement('div');sign.className='scene-sign';sign.textContent=c.sign;text.appendChild(sign)}prologue.querySelector('.scene-visual').classList.toggle('interior',!!c.interior);prologue.querySelector('.scene-location').textContent=c.location;root.querySelector('#scene-number').textContent=`${String(scene+1).padStart(2,'0')} / 09`;prologue.querySelector('.scene-progress').innerHTML=chapters.map((_,i)=>`<span class="${i<=scene?'read':''}"></span>`).join('');root.querySelector('#scene-prev').disabled=scene===0;root.querySelector('#scene-next').innerHTML=(scene===0?'Войти в город':scene===8?'К карте города':'Далее')+' <i data-lucide="arrow-right" aria-hidden="true"></i>';if(globalThis.lucide)lucide.createIcons();}
function persist(){if(window.openai?.setWidgetState){const old=window.openai.widgetState||{};window.openai.setWidgetState({modelContent:{...(old.modelContent||{}),screen:'Пролог',scene:chapters[scene].title},privateContent:{...(old.privateContent||{}),designVersion:5,screen:2,storyScene:scene}}).catch(()=>{});}}
root.querySelector('#scene-next').addEventListener('click',()=>{if(scene<8){scene++;draw();persist();}else root.querySelector('.picker [data-go="3"]').click();});
root.querySelector('#scene-prev').addEventListener('click',()=>{if(scene>0){scene--;draw();persist();}});
function restore(s){const p=s?.privateContent;if(Number.isInteger(p?.storyScene)&&p.storyScene>=0&&p.storyScene<9){scene=p.storyScene;draw();}}
draw();restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
root.querySelectorAll('button,summary').forEach(b=>b.classList.add('cursor-interaction'));
})();
</script>

#arena-concept .hero-art .hero-label{position:absolute;right:9px;bottom:48px;background:#f6fafbe8;border-left:2px solid var(--red);padding:8px 7px 8px 10px;font-size:9px;line-height:1.4;letter-spacing:1px;color:#385366;box-shadow:0 3px 10px #6a819317}
#arena-concept .hero-art .hero-index{position:absolute;left:15px;bottom:15px;background:#b6404b;color:#fff;padding:6px 8px;font-family:'Bahnschrift Condensed','Arial Narrow',sans-serif;font-size:14px;letter-spacing:1px}
#arena-concept .coordinates{border-top:1px solid #bbd2de;padding-top:10px;margin:4px 24px 0}
#arena-concept [data-screen="0"] .bottom{padding-top:11px}
#arena-concept .primary{background:#b6404b;border:1px solid #b6404b;box-shadow:4px 5px 0 #dce7ed;border-radius:9px;font-weight:500}
#arena-concept .secondary{background:#f8fbfc;border:1px solid #c8dbe5;box-shadow:4px 5px 0 #e0e9ee;border-radius:9px}
#arena-concept .welcome-foot{letter-spacing:1.15px}
#arena-concept h2{font-family:'Bahnschrift Condensed','Arial Narrow',sans-serif;text-transform:uppercase;font-size:33px;line-height:1.08;letter-spacing:-.3px;font-weight:400}
#arena-concept .topline .tag{border-radius:2px;background:#f4f9fa}
#arena-concept .back{border-radius:9px}
#arena-concept .eyebrow{letter-spacing:1.7px}
#arena-concept [data-screen="1"] .pad{padding-top:10px}
#arena-concept [data-screen="1"] h2{font-size:33px;margin:8px 0 4px}
#arena-concept [data-screen="1"] .pad>p{margin:4px 0}
#arena-concept .profile-portrait{float:right;width:96px;height:104px;margin:-8px -4px 6px 8px;background:var(--mind-image) center 20%/cover;border-radius:20px 20px 9px 9px;border:1px solid #d6e7ed;box-shadow:3px 4px 0 #dcebf1}
#arena-concept .profile-badge{font-size:9px;letter-spacing:1.1px;color:#a7434e;margin-top:8px}
#arena-concept label{color:#476577}
#arena-concept input,#arena-concept textarea,#arena-concept select{border-radius:9px;background:#fcfdfd}
#arena-concept [data-screen="2"] .scene-visual{background:#e8f2f7;overflow:hidden}
#arena-concept [data-screen="2"] .scene-visual .scene-city{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
#arena-concept [data-screen="2"] .scene-visual .scene-city svg{height:210px;width:100%}
#arena-concept [data-screen="2"] .scene-visual.interior{background:#e7f1f6}
#arena-concept [data-screen="2"] .scene-visual.interior .scene-city{display:none}
#arena-concept [data-screen="2"] .scene-visual.interior:before{content:'';position:absolute;inset:0;background:var(--mind-image) center 25%/cover;opacity:.83}
#arena-concept [data-screen="2"] .scene-visual.interior:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#e7f1f6a6,transparent 55%),linear-gradient(0deg,#f5f8fa,transparent 55%)}
#arena-concept .scene-location{z-index:2;background:#f5f8fae6;padding:5px 8px;left:18px;bottom:12px}
#arena-concept .scene-body{background:#f8fbfcea;margin:-2px 13px 0;border:1px solid #dce8ee;border-radius:3px 3px 18px 18px;padding:16px 13px 6px;min-height:300px;box-shadow:5px 6px 0 #deebf1}
#arena-concept .scene-body h2{margin:1px 0 15px;font-size:30px}
#arena-concept .scene-body p{line-height:1.65;color:#3f5665}
#arena-concept .scene-sign{background:#e6f2f8;border:1px solid #cce4ee;border-left:3px solid var(--red);font-family:'Bahnschrift Condensed','Arial Narrow',sans-serif;font-size:15px;letter-spacing:.5px}
#arena-concept .scene-progress span.read{background:var(--red)}
#arena-concept [data-screen="3"] .pad{padding-bottom:8px}
#arena-concept [data-screen="3"] .pad h2{margin:9px 0}
#arena-concept .map{background:#eaf3f7!important;border:1px solid #cbdfe9;border-radius:16px;box-shadow:inset 0 0 0 6px #f5f9fbc4,4px 5px 0 #d8e6ee;margin:0 14px;height:350px}
#arena-concept .map>.city{display:none}
#arena-concept .map>.route{display:none}
#arena-concept .map .map-game{width:100%;height:100%;display:block}
#arena-concept .map-node{width:42px;height:42px;border-radius:9px;border:2px solid #fff;background:#d9eaf3;color:#33596d;box-shadow:3px 4px 0 #94b8ca;font-family:'Bahnschrift Condensed','Arial Narrow',sans-serif}
#arena-concept .map-node.current{box-shadow:3px 4px 0 #8d525c,0 0 0 5px #ffffff78}
#arena-concept .map-caption{bottom:8px;background:#f7fbfce8;border:1px solid #d7e6ed;font-size:8px}
#arena-concept .module{padding:10px 0}
#arena-concept .module .number{font-family:'Bahnschrift Condensed','Arial Narrow',sans-serif;color:#a84a56}
#arena-concept .module b{font-size:12px}
#arena-concept .module small{font-size:10px}
#arena-concept [data-screen="4"]{background:#f4f7f9;background-image:radial-gradient(circle at 70% 10%,#e5eff4,transparent 55%)}
#arena-concept [data-screen="4"] h2{font-family:'Segoe UI',Arial,sans-serif;text-transform:none;font-size:31px;letter-spacing:-1.1px;font-weight:350}
#arena-concept [data-screen="4"] .secondary{border-radius:24px;box-shadow:inset 0 1px 0 white,0 5px 14px #637b8d09}
#arena-concept [data-screen="5"] .paper{border-top:3px solid #bd4f5b;background:linear-gradient(125deg,#fff,#f0f7fa)}
#arena-concept [data-screen="6"] .audio{border-radius:14px;background:#e5f0f6;box-shadow:4px 5px 0 #d2e3ec}
#arena-concept [data-screen="6"] .audio-head:before{content:'';width:23px;height:23px;border:1px solid #a6c5d6;border-radius:6px;background:var(--mind-image) center 18%/cover;position:absolute;right:40px;margin-top:20px;opacity:.8}
#arena-concept [data-screen="6"] .waves i{background:#7eabc3}
#arena-concept [data-screen="6"] .play{border-radius:9px;box-shadow:3px 4px 0 #8e4252}
#arena-concept .notice{border-left:2px solid #b6404b;border-radius:2px 12px 12px 2px}
#arena-concept [data-screen="7"] .choices button{border-radius:7px;background:#f9fcfd}
#arena-concept [data-screen="7"] .choices button[aria-pressed=true]{border-color:#b6404b;background:#f8ecef;color:#7a3a45}
#arena-concept [data-screen="8"] .final-orb{background:var(--mind-image) center 14%/cover;border:6px solid #e7f2f7;box-shadow:0 0 0 1px #c6dce7,5px 8px 0 #d9e8ee;position:relative}
#arena-concept [data-screen="8"] .final-orb span{position:absolute;width:130px;height:2px;top:48%;background:#b6404b;box-shadow:0 0 8px #b6404b}
@media(max-width:380px){#arena-concept .welcome-title h1{font-size:46px}#arena-concept .hero-art{height:260px}#arena-concept .scene-body{min-height:355px}#arena-concept .profile-portrait{width:76px;height:84px}}
</style>

<style>
#arena-concept{--game-ink:#22333e;--game-red:#b83c46;--game-blue:#b9dbea;--game-line:#cbdde6;color:var(--game-ink)}
#arena-concept .screen{background-color:#eef3f6;background-image:none}
#arena-concept [data-screen="0"]{background-color:#eaf0f3;background-image:linear-gradient(180deg,#e8edf455 0%,#eaf0f422 37%,#ebf0f430 52%,#f2f5f6 76%),var(--city-reference);background-size:cover;background-position:center 44%}
#arena-concept [data-screen="0"]:before{display:none}
#arena-concept .welcome-title{padding:24px 22px 0;text-shadow:0 1px #ffffffb0}
#arena-concept .welcome-title .eyebrow{color:#394f5c}
#arena-concept .welcome-title h1{font-family:'Arial Narrow','Bahnschrift Condensed',sans-serif;font-weight:700;font-size:47px;line-height:.99;letter-spacing:-1.8px;color:#233744;max-width:310px}
#arena-concept .welcome-title h1:after{content:'.';color:var(--game-red)}
#arena-concept .welcome-title p{color:#344c5c;font-weight:500;max-width:255px}
#arena-concept .hero-art{height:280px;display:block;margin-top:7px}
#arena-concept .hero-character{display:none}
#arena-concept .hero-art .hero-code{writing-mode:initial;transform:none;top:18px;left:auto;right:12px;padding:6px 8px;background:#f5f8f7d9;border-left:2px solid var(--game-red);font-size:8px}
#arena-concept .hero-art .hero-label{bottom:35px;right:12px;padding:8px 10px;background:#f6f8f8e6;color:#263d4a}
#arena-concept .hero-art .hero-index{left:14px;bottom:15px}
#arena-concept .coordinates{padding-top:8px;margin:0 23px 0;border-color:#9db8c5;color:#354f5d}
#arena-concept .coordinates span:last-child{background:#eff3f5d9;padding:4px 6px}
#arena-concept [data-screen="0"] .bottom{padding-top:10px}
#arena-concept .welcome-foot{color:#476170}
#arena-concept .primary{border-radius:8px;background:var(--game-red);border-color:var(--game-red);box-shadow:0 4px 10px #95414a23;font-size:14px;font-weight:500}
#arena-concept .secondary{border-radius:8px;box-shadow:none}
#arena-concept [data-screen="2"]{background-image:linear-gradient(180deg,#dfeaf0aa 0%,#f3f6f7bd 31%,#eef3f5 58%);background-color:#e8eff3;position:relative}
#arena-concept [data-screen="2"] .topline{position:relative;z-index:3}
#arena-concept [data-screen="2"] .scene-visual{height:210px;margin-top:6px;background:transparent;position:relative}
#arena-concept [data-screen="2"] .scene-visual .scene-city{position:absolute;inset:-70px -15px -10px;opacity:1;overflow:hidden}
#arena-concept [data-screen="2"] .scene-visual .scene-city svg{width:100%;height:310px;object-fit:cover;filter:saturate(.72)}
#arena-concept [data-screen="2"] .scene-visual .scene-location{z-index:2;bottom:10px}
#arena-concept [data-screen="2"] .scene-visual.interior:before{background:var(--city-reference) center/cover;opacity:.75}
#arena-concept [data-screen="2"] .scene-body{position:relative;z-index:2;margin:-8px 12px 0;background:#f6f8f9f0;box-shadow:0 8px 28px #4f68751c;border:1px solid #e0e8ec;border-radius:16px;padding:18px 16px 8px;min-height:326px}
#arena-concept [data-screen="2"] .scene-body h2{font-family:'Segoe UI',Arial,sans-serif;text-transform:none;font-size:27px;font-weight:500;letter-spacing:-.7px}
#arena-concept [data-screen="2"] .scene-nav{position:relative;z-index:2;padding-top:10px}
#arena-concept [data-screen="2"] .scene-actions .secondary{border-radius:12px}
#arena-concept [data-screen="2"] #scene-next{border-radius:9px}
#arena-concept [data-screen="3"] .topline{padding-top:8px}
#arena-concept [data-screen="3"] .pad{padding:10px 21px 7px}
#arena-concept [data-screen="3"] .pad h2{font-family:'Segoe UI',Arial,sans-serif;text-transform:none;font-size:27px;letter-spacing:-.7px;line-height:1.08;margin:7px 0}
#arena-concept [data-screen="3"] .pad p{margin:3px 0}
#arena-concept [data-screen="3"] .progress{margin-top:11px}
#arena-concept [data-screen="3"] .micro{margin:6px 0;font-size:10px}
#arena-concept [data-screen="3"] .map{height:420px;margin:0 11px;border-radius:13px;position:relative;overflow:hidden;background:#e4edf0!important;border:1px solid #d5e1e5;box-shadow:0 5px 12px #536a6f14}
#arena-concept [data-screen="3"] .map .map-game{display:none}
#arena-concept .map-overview{position:absolute;inset:0;background-image:linear-gradient(0deg,#e3ebedd1,#e3ebed33 35%,#e3ebed15 70%,#e3ebed70),var(--city-map);background-size:cover;background-position:center;}
#arena-concept .map-route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#arena-concept .map-route .glow{fill:none;stroke:#f8fbfc;stroke-width:10;stroke-linecap:round}
#arena-concept .map-route .path{fill:none;stroke:var(--game-red);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:4 5}
#arena-concept .route-node{position:absolute;left:7%;width:190px;max-width:74%;text-align:left;border:1px solid #ffffff;background:#f8fafbf0;border-radius:10px;padding:11px 12px 10px 14px;box-shadow:0 5px 14px #3d536023;color:#253944;min-height:60px;z-index:2}
#arena-concept .route-node:before{content:'';position:absolute;left:-8px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--game-red);border:2px solid #fff;box-shadow:0 0 0 2px #b83c4638}
#arena-concept .route-node strong{display:block;font-size:12px;line-height:1.22;font-weight:600}
#arena-concept .route-node small{display:block;font-size:9px;color:#657986;margin-top:5px}
#arena-concept .route-node .route-label{display:block;font-size:8px;letter-spacing:1.2px;color:var(--game-red);margin-bottom:5px}
#arena-concept .route-node[data-go="6"]{left:auto;right:6%;width:176px}
#arena-concept .route-node[data-go="8"]{left:12%;width:173px}
#arena-concept .route-node[aria-disabled="true"]{opacity:.8}
#arena-concept .map-caption{z-index:3;bottom:8px;left:9px}
#arena-concept [data-screen="3"] .modules{display:none}
#arena-concept [data-screen="3"] .nav{margin-top:auto}
#arena-concept [data-screen="3"] .map-node{display:none}
#arena-concept [data-screen="3"] .bottom{display:none}
#arena-concept .screen .nav{background:#f6f8f9;border-color:#dfe6e9}
#arena-concept [data-screen="4"]{background-image:radial-gradient(circle at 80% 8%,#e4edf1,transparent 45%)}
@media(max-width:380px){#arena-concept [data-screen="3"] .map{height:395px}#arena-concept .route-node{width:170px;min-height:57px;padding:9px 10px 8px 12px}#arena-concept .route-node[data-go="6"]{width:162px}#arena-concept .route-node[data-go="8"]{width:160px}#arena-concept .welcome-title h1{font-size:43px}#arena-concept .hero-art{height:245px}}

h(option=>{const item=document.createElement('button');item.type='button';item.className='picker-option cursor-interaction';item.setAttribute('role','option');item.setAttribute('aria-selected','false');item.textContent=option.textContent;item.addEventListener('click',()=>{select.value=option.value;trigger.textContent=option.textContent;trigger.setAttribute('aria-expanded','false');shell.dataset.invalid='false';menu.hidden=true;menu.querySelectorAll('[role="option"]').forEach(o=>o.setAttribute('aria-selected',String(o===item)));});menu.append(item);});trigger.addEventListener('click',()=>{const open=menu.hidden;form.querySelectorAll('.picker-menu').forEach(m=>m.hidden=true);form.querySelectorAll('.picker-trigger').forEach(t=>t.setAttribute('aria-expanded','false'));menu.hidden=!open;trigger.setAttribute('aria-expanded',String(open));});select.classList.add('picker-native');select.required=false;select.insertAdjacentElement('afterend',shell);shell.append(trigger,menu);});form.addEventListener('submit',event=>{const missing=Array.from(form.querySelectorAll('select[name="goal"],select[name="industry"]')).find(s=>!s.value);if(missing){event.preventDefault();const shell=missing.nextElementSibling;shell.dataset.invalid='true';const trigger=shell.querySelector('.picker-trigger');trigger.setAttribute('aria-expanded','true');shell.querySelector('.picker-menu').hidden=false;trigger.focus();}},true);document.addEventListener('click',event=>{if(!form.contains(event.target)){form.querySelectorAll('.picker-menu').forEach(m=>m.hidden=true);form.querySelectorAll('.picker-trigger').forEach(t=>t.setAttribute('aria-expanded','false'));}});}
